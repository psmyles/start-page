<!DOCTYPE html>
<html lang="en">

<!--
  The page shell. The tiles are not in here - they are built by script.js from
  links.json. To add, remove or change a link, edit links.json and push.

  This same file is packaged as the extension's new-tab page, so changes to it
  need a new extension version (see README).
-->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="toggle-wrapper">
    <span class="toggle-text">Local</span>
    <label class="switch">
      <input type="checkbox" id="url-toggle">
      <span class="slider"></span>
    </label>
    <span class="toggle-text">Internet</span>
  </div>

  <div class="container">
    <div class="datetime-line">
      <span id="time" class="time"></span>
      <span> • </span>
      <span id="date" class="date"></span>
    </div>

    <div class="icon-grid"></div>
  </div>
  <script src="script.js"></script>
</body>

</html>
